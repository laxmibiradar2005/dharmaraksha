services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: dharmaraksha
      POSTGRES_USER: dharmaraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the private password in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - legal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dharmaraksha -d dharmaraksha"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  legal-postgres:
