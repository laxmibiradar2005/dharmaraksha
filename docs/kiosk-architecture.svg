<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Dharmaraksha kiosk target architecture</title><desc id="desc">Phone and existing ESP32 reader connect to an UNO Q gateway. Firebase is central encrypted storage. Laptop RAG and Gemini serve online answers, Sarvam provides online voice, and a local small model handles offline text and cached cases. Authentication and encryption are planned, not deployed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#b6a17c"/></marker></defs><rect width="1600" height="1000" fill="#101b18"/><g font-family="Segoe UI,Arial,sans-serif"><text x="55" y="54" font-size="14" fill="#d8bd8d" font-weight="600">DHARMARAKSHA / SYSTEM DESIGN</text><text x="55" y="108" font-size="36" fill="#f3eddf" font-weight="600">One kiosk. A private case workspace.</text><text x="55" y="145" font-size="17" fill="#aebbaf" font-weight="400">Target design · Firebase central storage · Existing ESP32 wiring preserved · 13 November 2026</text>
<rect x="475" y="207" width="490" height="650" rx="24" fill="#16251f" stroke="#b79b6b" stroke-width="2"/><text x="503" y="250" font-size="23" fill="#e7ce9e" font-weight="600">ARDUINO UNO Q</text><text x="503" y="280" font-size="16" fill="#bac6bb" font-weight="400">4 GB RAM / 32 GB eMMC · Debian Linux</text>
<rect x="55" y="307" width="335" height="155" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="75" y="331" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="93" y="350" font-size="21" fill="#f3eddf" font-weight="600">Android / Chrome</text><text x="79" y="385" font-size="16" fill="#bac6bb" font-weight="400">Interactive 3D courtroom</text><text x="79" y="410" font-size="16" fill="#bac6bb" font-weight="400">PIN entry and private case selection</text><text x="79" y="435" font-size="16" fill="#bac6bb" font-weight="400">Same Wi-Fi / optional HTTPS tunnel</text>
<rect x="55" y="523" width="335" height="155" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="75" y="547" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="93" y="566" font-size="21" fill="#f3eddf" font-weight="600">Existing ESP32-S3</text><text x="79" y="601" font-size="16" fill="#bac6bb" font-weight="400">RC522 card reader + 3.5-inch TFT</text><text x="79" y="626" font-size="16" fill="#bac6bb" font-weight="400">Same GPIOs and separate SPI buses</text><text x="79" y="651" font-size="16" fill="#bac6bb" font-weight="400">Tap event only; no private case data</text>
<rect x="55" y="738" width="335" height="118" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="75" y="762" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="93" y="781" font-size="21" fill="#f3eddf" font-weight="600">USB camera + mic</text><text x="79" y="816" font-size="16" fill="#bac6bb" font-weight="400">Bluetooth speaker on UNO Q</text><text x="79" y="841" font-size="16" fill="#bac6bb" font-weight="400">UNO Q Linux device services</text>
<rect x="500" y="315" width="440" height="150" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="520" y="339" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="538" y="358" font-size="21" fill="#f3eddf" font-weight="600">Authenticated gateway</text><text x="524" y="393" font-size="16" fill="#bac6bb" font-weight="400">Device pairing · RFID + PIN challenge</text><text x="524" y="418" font-size="16" fill="#bac6bb" font-weight="400">Session lock · Consent · Model routing</text><text x="524" y="443" font-size="16" fill="#bac6bb" font-weight="400">Owner-scoped case and document APIs</text>
<rect x="500" y="515" width="440" height="130" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="520" y="539" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="538" y="558" font-size="21" fill="#f3eddf" font-weight="600">Encrypted local case cache</text><text x="524" y="593" font-size="16" fill="#bac6bb" font-weight="400">Previously synchronized cases only</text><text x="524" y="618" font-size="16" fill="#bac6bb" font-weight="400">Ciphertext on disk; unlock per session</text>
<rect x="500" y="693" width="440" height="133" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="520" y="717" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="538" y="736" font-size="21" fill="#f3eddf" font-weight="600">Local text model</text><text x="524" y="771" font-size="16" fill="#bac6bb" font-weight="400">llama.cpp · Llama 3.2 1B Q4 candidate</text><text x="524" y="796" font-size="16" fill="#bac6bb" font-weight="400">Offline text only · Benchmark required</text>
