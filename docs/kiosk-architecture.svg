<rect x="1070" y="545" width="475" height="140" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="1090" y="569" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="1108" y="588" font-size="21" fill="#f3eddf" font-weight="600">Firebase central storage</text><text x="1094" y="623" font-size="16" fill="#bac6bb" font-weight="400">Existing Firebase project retained</text><text x="1094" y="648" font-size="16" fill="#bac6bb" font-weight="400">Encrypted per-user cases and documents</text><text x="1094" y="673" font-size="16" fill="#bac6bb" font-weight="400">Sync ciphertext to and from UNO Q</text>
<rect x="1070" y="737" width="475" height="118" rx="16" fill="#1b2925" stroke="#48564c"/><rect x="1090" y="761" width="4" height="24" rx="2" fill="#d8bd8d"/><text x="1108" y="780" font-size="21" fill="#f3eddf" font-weight="600">Sarvam AI</text><text x="1094" y="815" font-size="16" fill="#bac6bb" font-weight="400">Online speech-to-text and text-to-speech</text><text x="1094" y="840" font-size="16" fill="#bac6bb" font-weight="400">No voice processing in offline mode</text>
