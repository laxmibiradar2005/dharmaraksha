<path d="M55 895 H1545" stroke="#3c4b40"/><text x="55" y="930" font-size="13" fill="#d8bd8d" font-weight="600">IMPLEMENTATION BOUNDARY</text><text x="55" y="960" font-size="16" fill="#c0c9be" font-weight="400">UI and provider connectors exist. RFID + PIN, encrypted vault, RAG service and physical device integration are still to be built and tested.</text>
